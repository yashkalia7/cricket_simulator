# Render blueprint — https://render.com/docs/blueprint-spec
#
# This was a static site. It is now a Node **web service**, because three things
# need a server that a static bundle cannot have:
#
#   - the OpenAI key, which must never reach a browser
#   - the password gate, which is only real if the server enforces it
#   - the decision log, which is only a shared dataset if it leaves the device
#
# The service serves the built web app *and* the API from one origin, so the
# session cookie is first-party and there is no CORS.
#
# SECRETS ARE NOT IN THIS FILE. `sync: false` means Render prompts for the value
# and stores it encrypted; it is never committed. This repo is public.

services:
  - type: web
    name: cricket-tactical-simulator
    runtime: node
    plan: free
    branch: main

    buildCommand: |
      npm install -g pnpm@11.20.0
      pnpm install --frozen-lockfile
      pnpm --filter @cricket/tokens build
      pnpm --filter @cricket/mobile exec expo export --platform web
      pnpm --filter @cricket/server build

    startCommand: node apps/server/dist/server.js

    healthCheckPath: /api/health

    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      # Where the built web app lives, relative to the repo root at runtime.
      - key: STATIC_DIR
        value: apps/mobile/dist

      # ---- set these in the dashboard; never in the repo ------------------
      # The landing-page password, shared by the team.
      - key: APP_PASSWORD
        sync: false
      # Supabase Postgres connection string (use the pooler URI).
      - key: DATABASE_URL
        sync: false
      # Absent key is not a failure: /api/suggest falls back to the
      # deterministic options, so the app still works without it.
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
